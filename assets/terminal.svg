<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <defs>
    <linearGradient id="term" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.5"/>
    </filter>
    <filter id="scanline" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="20" y="20" width="840" height="340" rx="16" fill="url(#term)" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="20" y="20" width="840" height="42" rx="16" fill="#0a1a33"/>
  <rect x="20" y="20" width="840" height="42" fill="#0a1a33"/>
  <circle cx="52" cy="41" r="7" fill="#00E5FF"/>
  <circle cx="78" cy="41" r="7" fill="#0066FF"/>
  <circle cx="104" cy="41" r="7" fill="#C0C0C0"/>
  <text x="430" y="47" text-anchor="middle" font-family="monospace" font-size="14" fill="#C0C0C0">venkat@ai-os: ~/system</text>

  <!-- CRT scanline overlay -->
  <rect x="20" y="0" width="840" height="20" fill="#00E5FF" opacity="0.05" filter="url(#scanline)">
    <animate attributeName="y" values="20;360;20" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Boot output lines with typing cursor -->
  <g font-family="monospace" font-size="16">
    <text x="40" y="105" fill="#00E5FF">> SYSTEM INITIALIZATION</text>
    <text x="40" y="135" fill="#C0C0C0"><tspan fill="#00E5FF">✓</tspan> Loading Neural Engine</text>
    <text x="40" y="163" fill="#C0C0C0"><tspan fill="#00E5FF">✓</tspan> Loading Artificial Intelligence Core</text>
    <text x="40" y="191" fill="#C0C0C0"><tspan fill="#00E5FF">✓</tspan> Loading Cloud Infrastructure</text>
    <text x="40" y="219" fill="#C0C0C0"><tspan fill="#00E5FF">✓</tspan> Loading Digital Twin Framework</text>
  </g>

  <!-- Animated progress bars -->
  <g>
    <rect x="380" y="127" width="120" height="8" rx="4" fill="#0a1a33"/>
    <rect x="380" y="127" width="120" height="8" rx="4" fill="url(#bar)" filter="url(#tglow)"><animate attributeName="width" values="0;120" dur="1.2s" fill="freeze"/></rect>
    <rect x="380" y="155" width="120" height="8" rx="4" fill="#0a1a33"/>
    <rect x="380" y="155" width="120" height="8" rx="4" fill="url(#bar)" filter="url(#tglow)"><animate attributeName="width" values="0;120" dur="1.4s" fill="freeze"/></rect>
    <rect x="380" y="183" width="120" height="8" rx="4" fill="#0a1a33"/>
    <rect x="380" y="183" width="120" height="8" rx="4" fill="url(#bar)" filter="url(#tglow)"><animate attributeName="width" values="0;120" dur="1.6s" fill="freeze"/></rect>
    <rect x="380" y="211" width="120" height="8" rx="4" fill="#0a1a33"/>
    <rect x="380" y="211" width="120" height="8" rx="4" fill="url(#bar)" filter="url(#tglow)"><animate attributeName="width" values="0;120" dur="1.8s" fill="freeze"/></rect>
  </g>

  <!-- STATUS block -->
  <g transform="translate(40,270)">
    <text x="0" y="0" font-family="monospace" font-size="16" fill="#C0C0C0">STATUS:</text>
    <text x="80" y="0" font-family="monospace" font-size="18" font-weight="bold" fill="#00E5FF" filter="url(#tglow)">
      ONLINE
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="210" y="0" font-size="20" fill="#00E5FF" filter="url(#tglow)">✓</text>
    <text x="240" y="0" font-family="monospace" font-size="16" fill="#00E5FF">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
      █
    </text>
    <!-- Live telemetry -->
    <text x="400" y="0" font-family="monospace" font-size="12" fill="#C0C0C0">CPU <tspan fill="#00E5FF">12%</tspan></text>
    <text x="480" y="0" font-family="monospace" font-size="12" fill="#C0C0C0">MEM <tspan fill="#00E5FF">34%</tspan></text>
    <text x="560" y="0" font-family="monospace" font-size="12" fill="#C0C0C0">NET <tspan fill="#00E5FF">0.8ms</tspan></text>
  </g>

  <!-- Bottom status bar -->
  <g font-family="monospace" font-size="11" fill="#C0C0C0">
    <text x="40" y="330">root@ai-os</text>
    <text x="760" y="330" text-anchor="end" fill="#00E5FF">◆ RUNNING</text>
  </g>
</svg>
</content>
