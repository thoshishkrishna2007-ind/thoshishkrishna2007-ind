<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="hglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hcore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glassmorphism card -->
  <rect x="20" y="20" width="780" height="400" rx="24" fill="url(#glass)" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="20" y="20" width="780" height="4" rx="2" fill="url(#line)"/>

  <!-- Hologram scan beam -->
  <rect x="20" y="0" width="780" height="60" fill="url(#line)" opacity="0.08">
    <animate attributeName="y" values="20;420;20" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- Sharp scan line -->
  <rect x="20" y="0" width="780" height="3" rx="1.5" fill="#00E5FF" opacity="0.6" filter="url(#hglow)">
    <animate attributeName="y" values="20;420;20" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Left: Holographic avatar core ===== -->
  <g transform="translate(170,210)">
    <!-- Rotating 3D rings -->
    <circle r="95" fill="none" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="95" fill="none" stroke="#0066FF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="20 15">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="82" ry="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Core glow -->
    <circle r="75" fill="url(#hcore)">
      <animate attributeName="r" values="75;95;75" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Avatar silhouette -->
    <circle cx="0" cy="-20" r="32" fill="#00E5FF" opacity="0.55"/>
    <path d="M-48,78 A48,48 0 0 1 48,78" fill="#00E5FF" opacity="0.55"/>
    <!-- Orbiting particles -->
    <circle r="4" fill="#00E5FF" filter="url(#hglow)">
      <animateMotion dur="12s" repeatCount="indefinite" path="M0,-95 A95,95 0 1,1 0,95 A95,95 0 1,1 0,-95"/>
    </circle>
    <circle r="3" fill="#FFFFFF">
      <animateMotion dur="9s" repeatCount="indefinite" path="M0,-82 A82,20 0 1,0 0,82 A82,20 0 1,0 0,-82" rotate="auto"/>
    </circle>
    <!-- Byte/data stream vertical -->
    <g font-family="monospace" font-size="8" fill="#00E5FF" opacity="0.5">
      <text x="-70" y="-60"><animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>0101</text>
      <text x="-70" y="-48"><animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>1010</text>
      <text x="60" y="60"><animate attributeName="opacity" values="0.5;0;0.5" dur="1.6s" repeatCount="indefinite"/>1100</text>
      <text x="60" y="72"><animate attributeName="opacity" values="0;0.5;0" dur="1.6s" repeatCount="indefinite"/>0110</text>
    </g>
  </g>

  <!-- ===== Right: Profile data ===== -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="300" y="72" font-size="30" font-weight="bold" fill="#FFFFFF" letter-spacing="1">VENKAT THOSHISH KRISHNA</text>
    <text x="300" y="102" font-size="16" fill="#00E5FF">Computer Science Engineer</text>

    <rect x="300" y="122" width="120" height="2" fill="url(#line)"/>

    <g font-size="15">
      <text x="300" y="162" fill="#C0C0C0">ROLE</text>
      <text x="300" y="184" fill="#FFFFFF">Full Stack Developer &amp; AI Researcher</text>

      <text x="300" y="222" fill="#C0C0C0">SPECIALIZATION</text>
      <text x="300" y="244" fill="#FFFFFF">AI · Full Stack · Cloud · Digital Twins · Cybersecurity</text>

      <text x="300" y="282" fill="#C0C0C0">EDUCATION</text>
      <text x="300" y="304" fill="#FFFFFF">B.Tech Computer Science Engineering</text>
      <text x="300" y="326" fill="#00E5FF">Aditya College of Engineering</text>
    </g>

    <!-- Status pill with live bars -->
    <g transform="translate(300,350)">
      <rect x="0" y="0" width="340" height="30" rx="15" fill="#061024" stroke="#00E5FF" stroke-opacity="0.5"/>
      <circle cx="18" cy="15" r="5" fill="#00E5FF" filter="url(#hglow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="monospace" font-size="13" fill="#FFFFFF">BUILDING NEXT GENERATION INTELLIGENT SYSTEMS</text>
      <!-- Equalizer -->
      <g transform="translate(318,8)">
        <rect x="0" y="7" width="3" height="6" rx="1" fill="#00E5FF"><animate attributeName="height" values="4;14;4" dur="0.8s" repeatCount="indefinite"/></rect>
        <rect x="5" y="10" width="3" height="3" rx="1" fill="#00E5FF"><animate attributeName="height" values="3;12;3" dur="0.6s" repeatCount="indefinite"/></rect>
        <rect x="10" y="5" width="3" height="8" rx="1" fill="#FFFFFF"><animate attributeName="height" values="5;15;5" dur="0.9s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>
</svg>
