<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="520" viewBox="0 0 520 520">
  <defs>
    <!-- CUSTOMIZATION: replace avatar URL -->
    <clipPath id="f-crop">
      <circle cx="260" cy="260" r="106"/>
    </clipPath>
    <!-- Luxury layered gradients -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <linearGradient id="vivRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#4D8DFF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="vivGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="metal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="520" height="520" fill="#050914" rx="32"/>

  <!-- Ambient glow -->
  <circle cx="260" cy="260" r="200" fill="url(#ambient)">
    <animate attributeName="r" values="200;212;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== TITANIUM SILVER FRAME (layered luxury) ===== -->
  <circle cx="260" cy="260" r="192" fill="url(#vivGlass)" stroke="url(#titanium)" stroke-width="3" filter="url(#metal)"/>
  <!-- Cyan gradient ring -->
  <circle cx="260" cy="260" r="180" fill="none" stroke="url(#vivRing)" stroke-opacity="0.6" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="30s" repeatCount="indefinite"/>
  </circle>
  <!-- Silver dotted ring -->
  <circle cx="260" cy="260" r="170" fill="none" stroke="#C0C0C0" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 8">
    <animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== AVATAR PHOTO ===== -->
  <image x="154" y="154" width="212" height="212" clip-path="url(#f-crop)"
         href="https://avatars.githubusercontent.com/u/254927016?v=4" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="260" cy="260" r="106" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Orbiting particles -->
  <circle r="5" fill="#00E5FF" filter="url(#glow)">
    <animateMotion dur="30s" repeatCount="indefinite" path="M260,68 A192,192 0 1,1 260,452 A192,192 0 1,1 260,68"/>
  </circle>
  <circle r="3.5" fill="#FFFFFF">
    <animateMotion dur="22s" repeatCount="indefinite" path="M260,90 A170,170 0 1,0 260,430 A170,170 0 1,0 260,90"/>
  </circle>

  <!-- ===== RACING HUD TICK MARKS (8-point precision) ===== -->
  <g stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2">
    <line x1="260" y1="62" x2="260" y2="82"/>
    <line x1="260" y1="438" x2="260" y2="458"/>
    <line x1="62" y1="260" x2="82" y2="260"/>
    <line x1="438" y1="260" x2="458" y2="260"/>
    <line x1="120" y1="120" x2="133" y2="133"/>
    <line x1="400" y1="120" x2="387" y2="133"/>
    <line x1="120" y1="400" x2="133" y2="387"/>
    <line x1="400" y1="400" x2="387" y2="387"/>
  </g>

  <!-- ===== SCANNING LINE ===== -->
  <rect x="62" y="0" width="396" height="2.5" rx="1.25" fill="#00E5FF" opacity="0.45">
    <animate attributeName="y" values="62;458;62" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== LUXURY LABELS ===== -->
  <g font-family="-apple-system, Arial, sans-serif">
    <text x="260" y="500" text-anchor="middle" font-size="11" letter-spacing="4" fill="#C0C0C0">VENKAT THOSHISH KRISHNA</text>
    <text x="260" y="518" text-anchor="middle" font-size="9" letter-spacing="7" fill="#00E5FF">AI IDENTITY SYSTEM</text>
  </g>

  <!-- Corner capsule accents -->
  <g fill="url(#vivRing)">
    <circle cx="76" cy="76" r="4" opacity="0.7"/>
    <circle cx="444" cy="76" r="4" opacity="0.7"/>
    <circle cx="76" cy="444" r="4" opacity="0.7"/>
    <circle cx="444" cy="444" r="4" opacity="0.7"/>
  </g>
</svg>
