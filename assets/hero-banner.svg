<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <!-- ===== CUSTOMIZATION: Global gradient definitions ===== -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070f"/>
      <stop offset="35%" stop-color="#0a1428"/>
      <stop offset="70%" stop-color="#0d1b3a"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8a8f98"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#061024" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0L0 0 0 36" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00E5FF" opacity="0.25"/>
    </pattern>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Animated gradient background -->
  <rect x="0" y="0" width="1200" height="560" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="560" fill="url(#grid)">
    <animate attributeName="x" values="0;36;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="0;36;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="560" fill="url(#dots)"/>

  <!-- Ambient color wash -->
  <ellipse cx="900" cy="280" rx="620" ry="330" fill="url(#core)" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="620;660;620" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== Floating particle field (12 particles) ===== -->
  <g filter="url(#softGlow)">
    <circle cx="120" cy="120" r="3" fill="#00E5FF">
      <animate attributeName="cy" values="120;70;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="120;140;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="90" r="2.5" fill="#FFFFFF">
      <animate attributeName="cy" values="90;140;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="420" r="2" fill="#0066FF">
      <animate attributeName="cy" values="420;360;420" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="440" r="3" fill="#00E5FF">
      <animate attributeName="cy" values="440;390;440" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="320" r="2" fill="#FFFFFF">
      <animate attributeName="cy" values="320;260;320" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="340" r="2.5" fill="#0066FF">
      <animate attributeName="cy" values="340;280;340" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="80" r="2" fill="#00E5FF">
      <animate attributeName="cy" values="80;120;80" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="500" r="2.5" fill="#C0C0C0">
      <animate attributeName="cy" values="500;460;500" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="180" r="2" fill="#FFFFFF">
      <animate attributeName="cy" values="180;140;180" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="500" r="3" fill="#0066FF">
      <animate attributeName="cy" values="500;450;500" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="200" r="2" fill="#00E5FF">
      <animate attributeName="cx" values="300;340;300" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="100" r="2.5" fill="#C0C0C0">
      <animate attributeName="cx" values="760;800;760" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== ADVANCED 3D HOLOGRAPHIC RING SYSTEM (right) ===== -->
  <g transform="translate(900,280)">
    <!-- Back glow -->
    <circle r="200" fill="url(#core)" opacity="0.25">
      <animate attributeName="r" values="200;215;200" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Ring 1: outer dashed, rotating -->
    <circle r="175" fill="none" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="70 18 20 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 1 counter -->
    <circle r="175" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 30">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- Ring 2: solid ellipse for 3D tilt effect -->
    <ellipse rx="150" ry="150" fill="none" stroke="#C0C0C0" stroke-opacity="0.4" stroke-width="1">
      <animate attributeName="ry" values="150;40;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="150;150;150" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="150" ry="150" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="40 20">
      <animate attributeName="ry" values="150;40;150" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Ring 3: horizontal orbital plane -->
    <ellipse rx="130" ry="34" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="130" ry="34" fill="none" stroke="#0066FF" stroke-opacity="0.3" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Ring 4: inner vertical -->
    <ellipse rx="34" ry="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbiting dots along paths -->
    <circle r="5" fill="#00E5FF" filter="url(#glow)">
      <animateMotion dur="22s" repeatCount="indefinite" path="M0,-175 A175,175 0 1,1 0,175 A175,175 0 1,1 0,-175"/>
    </circle>
    <circle r="4" fill="#FFFFFF">
      <animateMotion dur="12s" repeatCount="indefinite" path="M0,-130 A130,34 0 1,0 0,130 A130,34 0 1,0 0,-130" rotate="auto"/>
    </circle>
    <circle r="3.5" fill="#0066FF" filter="url(#softGlow)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M34,0 A34,105 0 1,0 -34,0 A34,105 0 1,0 34,0"/>
    </circle>
    <circle r="3" fill="#C0C0C0">
      <animateMotion dur="18s" repeatCount="indefinite" path="M0,-150 A150,150 0 1,1 0,150 A150,150 0 1,1 0,-150"/>
    </circle>
  </g>

  <!-- ===== AI REACTOR CORE (center of rings) ===== -->
  <g transform="translate(900,280)" filter="url(#bigGlow)">
    <!-- Outer energy shell -->
    <circle r="58" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.7">
      <animate attributeName="r" values="58;68;58" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="42" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="42;48;42" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Core inner white pulse -->
    <circle r="14" fill="#FFFFFF">
      <animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Spinning electron arcs -->
    <path d="M-45,0 A45,45 0 1 1 45,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-45 A45,45 0 1 0 0,45" fill="none" stroke="#00E5FF" stroke-opacity="0.8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#00E5FF" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M0,-62 A62,62 0 1,1 0,62 A62,62 0 1,1 0,-62"/>
    </circle>
  </g>

  <!-- ===== Hologram scan beam sweeping across ===== -->
  <rect x="0" y="0" width="1200" height="560" fill="url(#scan)">
    <animate attributeName="y" values="-560;560;-560" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== HUD corner brackets ===== -->
  <g stroke="#00E5FF" stroke-opacity="0.7" fill="none" stroke-width="2">
    <path d="M340,40 L400,40 M400,40 L400,60"/>
    <path d="M340,520 L400,520 M400,520 L400,500"/>
    <path d="M860,40 L800,40 M800,40 L800,60"/>
    <path d="M860,520 L800,520 M800,520 L800,500"/>
  </g>

  <!-- ===== HUD readouts (left column) ===== -->
  <g font-family="monospace" font-size="12" fill="#00E5FF" opacity="0.85">
    <text x="30" y="40">SYS.ONLINE</text>
    <text x="30" y="58" fill="#FFFFFF" opacity="0.6">RESPONSE 0.4ms</text>
    <text x="30" y="540">NEURAL.CORE v2.0</text>
    <text x="30" y="558" fill="#FFFFFF" opacity="0.6">DIGITAL TWIN READY</text>
  </g>

  <!-- HUD right column -->
  <g font-family="monospace" font-size="12" fill="#00E5FF" opacity="0.85">
    <text x="980" y="40">AI.ENGINE</text>
    <text x="980" y="58" fill="#FFFFFF" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>▮▮▮▮▮▮ 96%</text>
    <text x="980" y="540" fill="#FFFFFF" opacity="0.6">SECURE LINK</text>
    <text x="980" y="558">TITANIUM.SHELL</text>
  </g>

  <!-- Animated radar sweep (bottom left) -->
  <g transform="translate(60,470)">
    <circle r="40" fill="none" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>
    <circle r="27" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
    <circle r="14" fill="none" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M0,0 L40,0 A40,40 0 0 1 28,28 Z" fill="#00E5FF" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="2.5" fill="#00E5FF" filter="url(#glow)"/>
  </g>

  <!-- ===== Left: Text block ===== -->
  <g transform="translate(60,150)">
    <!-- Animated eyebrow line -->
    <rect x="0" y="0" width="70" height="3" fill="url(#cyanGlow)">
      <animate attributeName="width" values="30;70;30" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="6" fill="#00E5FF">VENKAT THOSHISH KRISHNA</text>

    <!-- Name -->
    <text x="0" y="115" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="60" letter-spacing="2" fill="#FFFFFF">
      VENKAT
      <tspan fill="url(#cyanGlow)"> THOSHISH</tspan>
    </text>
    <text x="0" y="175" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="60" letter-spacing="2" fill="url(#silver)">KRISHNA</text>

    <!-- Animated subtitle -->
    <g font-family="monospace" font-size="20" fill="#C0C0C0">
      <text x="0" y="245">
        <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
        > AI ENGINEER
      </text>
      <text x="0" y="277">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
        > DIGITAL TWIN ARCHITECT
      </text>
      <text x="0" y="309">
        <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
        > FUTURE TECHNOLOGY BUILDER
      </text>
    </g>

    <!-- Status pill -->
    <g transform="translate(0,355)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#061024" stroke="#00E5FF" stroke-opacity="0.5"/>
      <circle cx="20" cy="17" r="6" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="22" font-family="monospace" font-size="14" fill="#FFFFFF">SYSTEM ACTIVE</text>
      <!-- Equalizer bars -->
      <g transform="translate(190,10)">
        <rect x="0" y="8" width="3" height="6" rx="1" fill="#00E5FF"><animate attributeName="height" values="4;14;4" dur="0.8s" repeatCount="indefinite"/></rect>
        <rect x="6" y="11" width="3" height="3" rx="1" fill="#00E5FF"><animate attributeName="height" values="3;12;3" dur="0.6s" repeatCount="indefinite"/></rect>
        <rect x="12" y="6" width="3" height="8" rx="1" fill="#FFFFFF"><animate attributeName="height" values="5;15;5" dur="0.9s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>
</svg>
</content>
