<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580">
  <defs>
    <linearGradient id="meter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="meterPure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>
    <filter id="mgrow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Panel background -->
  <rect x="10" y="10" width="900" height="560" rx="20" fill="url(#panel)" stroke="#00E5FF" stroke-opacity="0.25"/>
  <rect x="10" y="10" width="900" height="4" rx="2" fill="url(#meter)"/>

  <!-- Scan line -->
  <rect x="10" y="0" width="900" height="3" fill="url(#meter)" opacity="0.3">
    <animate attributeName="y" values="10;570;10" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="70" font-size="26" font-weight="bold" fill="#FFFFFF" letter-spacing="2">TECHNOLOGY ENGINE</text>
    <text x="40" y="96" font-size="14" fill="#00E5FF" font-family="monospace">> skill_matrix.load()</text>
  </g>

  <!-- LANGUAGES -->
  <text x="40" y="150" font-size="15" fill="#C0C0C0" letter-spacing="2">LANGUAGES</text>
  <g font-family="monospace" font-size="13">
    <text x="40" y="180" fill="#FFFFFF">JAVA</text><rect x="160" y="168" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="160" y="168" width="52" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;52;52" dur="2s" fill="freeze"/></rect>
    <text x="230" y="181" fill="#00E5FF">87%</text>

    <text x="350" y="180" fill="#FFFFFF">PYTHON</text><rect x="470" y="168" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="470" y="168" width="55" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;55;55" dur="2s" fill="freeze"/></rect>
    <text x="540" y="181" fill="#00E5FF">92%</text>

    <text x="650" y="180" fill="#FFFFFF">C</text><rect x="700" y="168" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="700" y="168" width="45" height="12" rx="6" fill="url(#meterPure)" filter="url(#mgrow)"><animate attributeName="width" values="0;45;45" dur="2s" fill="freeze"/></rect>
    <text x="770" y="181" fill="#C0C0C0">75%</text>
  </g>

  <!-- FRONTEND -->
  <text x="40" y="235" font-size="15" fill="#C0C0C0" letter-spacing="2">FRONTEND</text>
  <g font-family="monospace" font-size="13">
    <text x="40" y="265" fill="#FFFFFF">REACT</text><rect x="160" y="253" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="160" y="253" width="50" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;50;50" dur="2s" fill="freeze"/></rect>
    <text x="230" y="266" fill="#00E5FF">83%</text>

    <text x="350" y="265" fill="#FFFFFF">NEXT.JS</text><rect x="470" y="253" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="470" y="253" width="48" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;48;48" dur="2s" fill="freeze"/></rect>
    <text x="540" y="266" fill="#00E5FF">80%</text>

    <text x="650" y="265" fill="#FFFFFF">TAILWIND</text><rect x="700" y="253" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="700" y="253" width="54" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;54;54" dur="2s" fill="freeze"/></rect>
    <text x="770" y="266" fill="#00E5FF">90%</text>
  </g>

  <!-- BACKEND -->
  <text x="40" y="320" font-size="15" fill="#C0C0C0" letter-spacing="2">BACKEND</text>
  <g font-family="monospace" font-size="13">
    <text x="40" y="350" fill="#FFFFFF">NODE.JS</text><rect x="160" y="338" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="160" y="338" width="50" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;50;50" dur="2s" fill="freeze"/></rect>
    <text x="230" y="351" fill="#00E5FF">83%</text>

    <text x="350" y="350" fill="#FFFFFF">FASTAPI</text><rect x="470" y="338" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="470" y="338" width="52" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;52;52" dur="2s" fill="freeze"/></rect>
    <text x="540" y="351" fill="#00E5FF">87%</text>
  </g>

  <!-- CLOUD -->
  <text x="40" y="405" font-size="15" fill="#C0C0C0" letter-spacing="2">CLOUD</text>
  <g font-family="monospace" font-size="13">
    <text x="40" y="435" fill="#FFFFFF">AZURE</text><rect x="160" y="423" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="160" y="423" width="49" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;49;49" dur="2s" fill="freeze"/></rect>
    <text x="230" y="436" fill="#00E5FF">82%</text>
  </g>

  <!-- AI -->
  <text x="40" y="490" font-size="15" fill="#C0C0C0" letter-spacing="2">ARTIFICIAL INTELLIGENCE</text>
  <g font-family="monospace" font-size="13">
    <text x="40" y="520" fill="#FFFFFF">ML</text><rect x="160" y="508" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="160" y="508" width="56" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;56;56" dur="2s" fill="freeze"/></rect>
    <text x="230" y="521" fill="#00E5FF">93%</text>

    <text x="350" y="520" fill="#FFFFFF">GEN AI</text><rect x="470" y="508" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="470" y="508" width="54" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;54;54" dur="2s" fill="freeze"/></rect>
    <text x="540" y="521" fill="#00E5FF">90%</text>

    <text x="650" y="520" fill="#FFFFFF">DIGITAL TWINS</text><rect x="700" y="508" width="60" height="12" rx="6" fill="#0a1a33"/>
    <rect x="700" y="508" width="58" height="12" rx="6" fill="url(#meter)" filter="url(#mgrow)"><animate attributeName="width" values="0;58;58" dur="2s" fill="freeze"/></rect>
    <text x="770" y="521" fill="#00E5FF">96%</text>
  </g>
</svg>
</content>
